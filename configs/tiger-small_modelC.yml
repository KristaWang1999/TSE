# Network config
audionet:
  audionet_name: TIGER_ModelC
  audionet_config:
    out_channels: 128
    in_channels: 256
    num_blocks: 4
    upsampling_depth: 5
    win: 640
    stride: 160
    num_sources: 1
    dvec_dim: 192

# Loss config
loss:
  train:
    loss_func: SingleSrcNegSDR
    sdr_type: snr
    config: 
      reduction: mean
    
  val:
    loss_func: SingleSrcNegSDR
    sdr_type: snr
    config:
      reduction: mean
    

# Training config
training:
  system: AudioLightningModule_ModelC
  gpus: [0]
  parallel: null
  epochs: 500
  early_stop:
    monitor: "val/si_snri/dataloader_idx_0"
    mode: max
    patience: 20
    verbose: true
  SpeedAug: False
  
# Optim config
optimizer:
  optim_name: adam
  lr: 0.00025
  weight_decay: 0

# Sche config
scheduler: 
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 10
    factor: 0.5

# Data config
datamodule:
  data_name: Libri2MixModule_ModelC
  data_config:
    train_dir: /scratch/s6295509/TSE/TIGER/tse_dataset/train-100
    valid_dir: /scratch/s6295509/TSE/TIGER/tse_dataset/dev
    test_dir: /scratch/s6295509/TSE/TIGER/tse_dataset/test
    n_src: 2
    sample_rate: 16000
    segment: 4.0
    normalize_audio: false
    batch_size: 4
    num_workers: 8
    pin_memory: true
    persistent_workers: false

exp:
  exp_name: TIGER-NewMonitor-ModelC